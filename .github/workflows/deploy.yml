name: Build and Deploy Artifacts

on:
  push:
    branches: ["deploy"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Create Deployment Package
        run: |
          mkdir -p deployment-package
          cp -r .next deployment-package/
          cp -r public deployment-package/
          cp next.config.js package.json Dockerfile deployment-package/
          tar -czf deployment-package.tar.gz -C deployment-package .

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@v1.0.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment-package.tar.gz"
          target: "~/deploy/clound_云服务/cloudServer"

      - name: Unpack and Run on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/deploy/clound_云服务/cloudServer
            tar -xzf deployment-package.tar.gz
            sudo docker build -t my-next-app:${{ github.sha }}
            if [ $(sudo docker ps -q -f name=my-running-app) ]; then 
              sudo docker stop my-running-app && 
              sudo docker rm my-running-app; 
            fi
            sudo docker run -d -p 80:3000 --name my-running-app my-next-app:${{ github.sha }}
            sudo docker image prune -f
