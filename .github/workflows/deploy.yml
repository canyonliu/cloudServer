name: Build on GitHub and Deploy to Server (远程构建与部署)

on:
  push:
    branches: ["before_database"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (检出代码)
        uses: actions/checkout@v4

      - name: Setup Node.js (设置Node.js环境)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies (安装依赖)
        run: npm ci

      - name: Generate Prisma Client (生成Prisma客户端)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Build Next.js Application (构建Next.js应用)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build

      - name: Create Deployment Package (创建部署压缩包)
        run: |
          # 关键修正：预先创建所有需要的子目录
          mkdir -p deployment-package/.next
          
          # 关键修正：使用 '/.' 复制 standalone 目录的内容，而不是目录本身
          echo "Copying standalone output..."
          cp -r .next/standalone/. deployment-package/
          
          echo "Copying static assets..."
          cp -r .next/static deployment-package/.next/
          
          if [ -d "public" ]; then
            echo "Copying public directory..."
            cp -r public deployment-package/
          fi
          
          echo "Copying Prisma schema..."
          cp -r prisma deployment-package/
          
          echo "Copying package files..."
          cp package.json Dockerfile deployment-package/
          
          echo "Creating archive..."
          tar -czf deployment-package.tar.gz -C deployment-package .

      - name: Ensure Directories Exist on Server (确保服务器目录存在)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/deploy/clound_云服务/cloudServer
            # 修正：将持久化目录放在用户主目录下
            mkdir -p ~/data/nextjs-app

      - name: Deploy to Server via SCP (通过SCP部署到服务器)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment-package.tar.gz"
          target: "~/deploy/clound_云服务/cloudServer"

      - name: Unpack, Migrate, and Run on Server (在服务器上解压、迁移并运行)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/deploy/clound_云服务/cloudServer
            tar -xzf deployment-package.tar.gz
            
            sudo docker build -t my-next-app:${{ github.sha }} .
            
            echo "Running database migration..."
            # 修正：将 docker run 命令写在单行以保证执行正确
            sudo docker run --rm -v ~/data/nextjs-app/dev.db:/app/prisma/dev.db -e DATABASE_URL='file:./prisma/dev.db' my-next-app:${{ github.sha }} npx prisma migrate deploy
            
            # 关键修正：更改数据库文件的所有者，使其能被容器内的 node 用户写入
            echo "Changing database file ownership..."
            sudo chown 1000:1000 ~/data/nextjs-app/dev.db
            
            if [ $(sudo docker ps -q -f name=my-running-cloud) ]; then 
              sudo docker stop my-running-cloud && sudo docker rm my-running-cloud; 
            fi
            
            echo "Starting new application container..."
            # 修正：将 docker run 命令写在单行以保证执行正确
            sudo docker run -d -p 80:3000 --name my-running-cloud -v ~/data/nextjs-app/dev.db:/app/prisma/dev.db -e DATABASE_URL='file:./prisma/dev.db' -e NEWS_API_KEY=${{ secrets.NEWS_API_KEY }} my-next-app:${{ github.sha }}
              
            sudo docker image prune -f