name: Build and Push to GHCR, then Deploy on Server

on:
  push:
    branches: ["before_database"]

env:
  REGISTRY: ghcr.io
  # 关键修正：使用正确的 toLower() 函数语法
  IMAGE_NAME: ${{ toLower(github.repository) }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

  deploy-on-server:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE_TAG=${{ github.sha }}
            IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            CONTAINER_NAME=my-running-cloud
            
            echo ${{ secrets.GH_PAT }} | sudo docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            sudo docker pull $IMAGE_NAME:$IMAGE_TAG
            
            echo "Running database migration..."
            sudo docker run --rm \
              -v ~/data/nextjs-app/dev.db:/app/prisma/dev.db \
              -e DATABASE_URL='file:./prisma/dev.db' \
              $IMAGE_NAME:$IMAGE_TAG \
              npx prisma migrate deploy
            
            sudo chown 1000:1000 ~/data/nextjs-app/dev.db
            
            if [ $(sudo docker ps -q -f name=$CONTAINER_NAME) ]; then 
              sudo docker stop $CONTAINER_NAME && sudo docker rm $CONTAINER_NAME; 
            fi
            
            echo "Starting new application container..."
            sudo docker run -d -p 80:3000 \
              --name $CONTAINER_NAME \
              -v ~/data/nextjs-app/dev.db:/app/prisma/dev.db \
              -e DATABASE_URL='file:./prisma/dev.db' \
              -e NEWS_API_KEY=${{ secrets.NEWS_API_KEY }} \
              $IMAGE_NAME:$IMAGE_TAG
              
            sudo docker image prune -a -f
