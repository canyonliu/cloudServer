name: Build and Push to GHCR, then Deploy on Server

on:
  push:
    branches: ["before_database"]

env:
  # 定义镜像名称，并转换为小写
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository | toLower }} # 关键修正：转换为小写

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 授权 job 可以推送到 GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }} # 使用您创建的 Personal Access Token

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 在构建时传入 DATABASE_URL，以便 prisma generate 能正常工作
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

  deploy-on-server:
    needs: build-and-push-image # 等待镜像构建推送完成后再执行
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 使用环境变量，使其更易于维护
            IMAGE_TAG=${{ github.sha }}
            IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            CONTAINER_NAME=my-running-cloud
            
            # 登录到 GHCR (如果您的服务器需要)
            echo ${{ secrets.GH_PAT }} | sudo docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # 拉取最新的镜像
            sudo docker pull $IMAGE_NAME:$IMAGE_TAG
            
            # 运行数据库迁移
            echo "Running database migration..."
            sudo docker run --rm \
              -v ~/data/nextjs-app/dev.db:/app/prisma/dev.db \
              -e DATABASE_URL='file:./prisma/dev.db' \
              $IMAGE_NAME:$IMAGE_TAG \
              npx prisma migrate deploy
            
            # 更改数据库文件权限
            sudo chown 1000:1000 ~/data/nextjs-app/dev.db
            
            # 停止并删除旧容器
            if [ $(sudo docker ps -q -f name=$CONTAINER_NAME) ]; then 
              sudo docker stop $CONTAINER_NAME && sudo docker rm $CONTAINER_NAME; 
            fi
            
            # 运行新的应用容器（去掉 -d，直接在前台运行以捕获日志）
            echo "Starting new application container in foreground for diagnostics..."
            sudo docker run -p 80:3000 \
              --name $CONTAINER_NAME \
              -v ~/data/nextjs-app/dev.db:/app/prisma/dev.db \
              -e DATABASE_URL='file:./prisma/dev.db' \
              -e NEWS_API_KEY=${{ secrets.NEWS_API_KEY }} \
              $IMAGE_NAME:$IMAGE_TAG || true
              
            # 清理旧的、未使用的 Docker 镜像
            sudo docker image prune -a -f